<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Contact The Pet Shop for information about pets and our services.">
	<title>Contact Us - The Pet Shop</title>
</head>

<body>

	<header>
		<h1>Contact The Pet Shop</h1>

		<nav>
			<a href="index.html">Home</a>
			<a href="contact.html">Contact Us</a>
		</nav>
	</header>

	<main>
		<h2>Get in Touch</h2>
		<p>We would love to hear from you!</p>

		<h3>Contact Information</h3>
		<p>Email: info@thepetshop.example</p>

		<h3>Send Us a Message</h3>

		<form>
			<label for="name">Name:</label>
			<input type="text" id="name" name="name">

			<br><br>

			<label for="email">Email:</label>
			<input type="email" id="email" name="email">

			<br><br>

			<label for="message">Message:</label>
			<textarea id="message" name="message"></textarea>

			<br><br>

			<button type="submit">Submit</button>
		</form>
	</main>

	<footer>
		<p>The Pet Shop - 2026</p>
	</footer>

</body>
</html>
